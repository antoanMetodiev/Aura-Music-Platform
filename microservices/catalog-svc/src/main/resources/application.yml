spring:
  application:
    name: catalog-svc

  # Loads a local, gitignored `.env` file (KEY=VALUE lines) the same way front-end/.env works —
  # convenient for local dev; real deployments (Render) set these as actual environment variables.
  config:
    import: "optional:file:.env[.properties]"

  # Supabase Postgres — always through the Supavisor pooler (port 6543, transaction mode), never
  # the direct connection. See the connection-pool sizing note under `datasource.hikari` below.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Modest on purpose: 7 services × a large pool exhausts Postgres' connection limit fast
      # (Free/small Supabase tiers cap around 60). 10 leaves headroom for the other services while
      # still letting one search's parallel track/album/artist upserts (CatalogService.upsertAll)
      # actually run concurrently instead of queuing behind a too-small pool.
      maximum-pool-size: 10
      minimum-idle: 1
      pool-name: catalog-svc-pool

  flyway:
    default-schema: catalog
    schemas: catalog
    locations: classpath:db/migration

  # RestClient timeouts for every outbound HTTP call this service makes (TIDAL included).
  http:
    client:
      connect-timeout: 3s
      read-timeout: 8s

server:
  port: ${PORT:8081}

music:
  providers:
    tidal:
      enabled: ${TIDAL_ENABLED:true}
      client-id: ${TIDAL_CLIENT_ID:}
      client-secret: ${TIDAL_CLIENT_SECRET:}
      country-code: ${TIDAL_COUNTRY_CODE:BG}
    # Cross-provider playback stays off by default until the compliance gate is cleared
    # (Project-Info.md §37) — Catalog doesn't act on this flag itself, but it's declared here so
    # every service reads the same config surface.
    crossProviderPlayback:
      enabled: false
    # Artist "About" (biography, tags, similar artists, stats). Free key from https://www.last.fm/api/account/create;
    # non-commercial by default, 5 req/s. Biographies are CC BY-SA and credited with a link in the UI.
    lastfm:
      enabled: ${LASTFM_ENABLED:true}
      api-key: ${LASTFM_API_KEY:}
      user-agent: ${LASTFM_USER_AGENT:Aura-Music-Platform/0.1 (dev; antoan.0418@gmail.com)}
    # Artist outside links (site, socials, Wikipedia) and a profile text used when Last.fm has no biography.
    discogs:
      enabled: ${DISCOGS_ENABLED:true}
      token: ${DISCOGS_TOKEN:}
      user-agent: ${DISCOGS_USER_AGENT:Aura-Music-Platform/0.1 (dev; antoan.0418@gmail.com)}

aura:
  catalog:
    metadata-ttl: 7d
    # Repeat searches are served from our own catalog (Caffeine in front of Postgres); the provider
    # is asked again only after search-ttl, and even then in the background (stale-while-revalidate).
    search-ttl: 24h
    search-memory-ttl: 10m
    default-search-limit: 10
    max-search-limit: 60
    search-page-size: 20
    # Queue semantics for the discography sync — how long an answer stays good, how soon a failure is
    # retried. The sync itself runs in worker-svc on its own TIDAL credentials (it claims an artist
    # through /internal/discography and posts the tracks back), so the pacing lives there, not here.
    # Only artists somebody opens enter the queue; nothing walks the catalog on its own any more.
    discography-sync:
      refresh-after: 30d
      retry-after: 1h

  # Lyrics (todo.md section 2): LRCLIB for dev/MVP (free, keyless, synced text); a licensed provider swaps in
  # behind the same port before a commercial launch. `none` disables lookups entirely.
  lyrics:
    provider: ${LYRICS_PROVIDER:lrclib}
    retry-missing-after: 30d
    lrclib:
      base-url: https://lrclib.net/api
      user-agent: ${LRCLIB_USER_AGENT:Aura-Music-Platform/0.1 (dev; antoan.0418@gmail.com)}
      search-duration-tolerance-seconds: 5

  # Artist "About" cache: refreshed from the providers after refresh-after; an artist nobody knew is retried after retry-missing-after.
  artist-about:
    refresh-after: 30d
    retry-missing-after: 30d

resilience4j:
  circuitbreaker:
    instances:
      tidal:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      # The discography worker's own breaker: it may open all it likes without affecting search.
      tidal-background:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 80
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
      lrclib:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      lastfm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      discogs:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
  # Resilience4j's TimeLimiter runs each call on a pool thread and *interrupts* it on timeout. Calls
  # now deliberately wait in TidalRequestThrottle (spacing, Retry-After pauses), so this has to be
  # far above the HTTP timeouts (spring.http.client.*), which are the real per-request guard.
  timelimiter:
    instances:
      tidal:
        timeout-duration: 120s
      tidal-background:
        timeout-duration: 300s
      lrclib:
        timeout-duration: 30s
      lastfm:
        timeout-duration: 20s
      # Two paced Discogs calls per artist (search, page).
      discogs:
        timeout-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Plain, readable console logging for local dev (IntelliJ, ./gradlew bootRun). Structured JSON logs
# (needed for log aggregation once this actually runs somewhere) live in application-prod.yml —
# activate with SPRING_PROFILES_ACTIVE=prod, which is what the Render deployment will set.
