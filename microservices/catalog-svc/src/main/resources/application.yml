spring:
  application:
    name: catalog-svc

  # Loads a local, gitignored `.env` file (KEY=VALUE lines) the same way front-end/.env works —
  # convenient for local dev; real deployments (Render) set these as actual environment variables.
  config:
    import: "optional:file:.env[.properties]"

  # Supabase Postgres — always through the Supavisor pooler (port 6543, transaction mode), never
  # the direct connection. See the connection-pool sizing note under `datasource.hikari` below.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Modest on purpose: 7 services × a large pool exhausts Postgres' connection limit fast
      # (Free/small Supabase tiers cap around 60). 10 leaves headroom for the other services while
      # still letting one search's parallel track/album/artist upserts (CatalogService.upsertAll)
      # actually run concurrently instead of queuing behind a too-small pool.
      maximum-pool-size: 10
      minimum-idle: 1
      pool-name: catalog-svc-pool

  flyway:
    default-schema: catalog
    schemas: catalog
    locations: classpath:db/migration

  # RestClient timeouts for every outbound HTTP call this service makes (TIDAL included).
  http:
    client:
      connect-timeout: 3s
      read-timeout: 8s

server:
  port: ${PORT:8081}

music:
  providers:
    tidal:
      enabled: ${TIDAL_ENABLED:true}
      client-id: ${TIDAL_CLIENT_ID}
      client-secret: ${TIDAL_CLIENT_SECRET}
      country-code: ${TIDAL_COUNTRY_CODE:BG}
    # Cross-provider playback stays off by default until the compliance gate is cleared
    # (Project-Info.md §37) — Catalog doesn't act on this flag itself, but it's declared here so
    # every service reads the same config surface.
    crossProviderPlayback:
      enabled: false

aura:
  catalog:
    metadata-ttl: 7d
    # Repeat searches are served from our own catalog (Caffeine in front of Postgres); the provider
    # is asked again only after search-ttl, and even then in the background (stale-while-revalidate).
    search-ttl: 24h
    search-memory-ttl: 10m
    default-search-limit: 10
    max-search-limit: 20

resilience4j:
  circuitbreaker:
    instances:
      tidal:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  # Resilience4j's own default TimeLimiter timeout is 1s, applied on top of (and independent from)
  # our RetryTemplate's own backoff in TidalApiClient — with search now firing several TIDAL calls
  # concurrently per request, a real call needs more headroom than that default before it's judged
  # "hung" and cancelled.
  timelimiter:
    instances:
      tidal:
        timeout-duration: 8s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Plain, readable console logging for local dev (IntelliJ, ./gradlew bootRun). Structured JSON logs
# (needed for log aggregation once this actually runs somewhere) live in application-prod.yml —
# activate with SPRING_PROFILES_ACTIVE=prod, which is what the Render deployment will set.
