spring:
  application:
    name: recommendation-svc

  # Loads a local, gitignored `.env` file — same mechanism as every other Aura service.
  config:
    import: "optional:file:.env[.properties]"

  # Same Supabase Postgres as the other services, own schema (`recommendation`) — always through the
  # Supavisor pooler (port 6543, transaction mode), never the direct connection.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      pool-name: recommendation-svc-pool

  flyway:
    default-schema: recommendation
    schemas: recommendation
    locations: classpath:db/migration

  # RestClient timeouts for every outbound HTTP call (catalog-svc, playback-svc).
  http:
    client:
      connect-timeout: 3s
      read-timeout: 8s

server:
  port: ${PORT:8083}

aura:
  # Both talk to the services directly (service-to-service), not through the gateway.
  catalog-client:
    base-url: ${CATALOG_SVC_URL:http://localhost:8081}
  playback-client:
    base-url: ${PLAYBACK_SVC_URL:http://localhost:8082}

  recommendations:
    # Candidate generation
    max-similar-artists: 40
    reverse-edge-factor: 0.6
    max-shared-tag-artists: 20
    seed-tags-used: 5
    tracks-per-candidate-artist: 8
    # Ranking
    artist-score-weight: 100
    track-popularity-weight: 35
    playable-bonus: 15
    per-artist-decay: 0.55
    max-tracks-per-artist: 3
    drop-unplayable: true
    # Serving
    feed-memory-ttl: 15m
    feed-memory-entries: 500
    default-limit: 20
    max-limit: 100

    # Queue semantics only. The graph is built by worker-svc on its own Last.fm key, through
    # /internal/graph; everything a request here does is SQL over what that left behind.
    graph-sync:
      seed-page-size: 200
      refresh-after: 60d

resilience4j:
  circuitbreaker:
    instances:
      catalog:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      # playback-svc being down only costs us the playability filter, so this one may open freely.
      playback:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  # Resilience4j's default TimeLimiter is 1s — too tight for a real call once connection setup is
  # counted, so each instance gets headroom above the HTTP
  # timeouts (spring.http.client.*), which are the real per-request guard.
  timelimiter:
    instances:
