spring:
  application:
    name: playback-svc

  # Loads a local, gitignored `.env` file — same mechanism as every other Aura service.
  config:
    import: "optional:file:.env[.properties]"

  # Same Supabase Postgres project as the other services, own schema (`playback`) — always through
  # the Supavisor pooler (port 6543, transaction mode), never the direct connection.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      pool-name: playback-svc-pool

  flyway:
    default-schema: playback
    schemas: playback
    locations: classpath:db/migration

  # RestClient timeouts for every outbound HTTP call this service makes (YouTube, catalog-svc).
  http:
    client:
      connect-timeout: 3s
      read-timeout: 8s

server:
  port: ${PORT:8082}

music:
  providers:
    youtube:
      enabled: ${YOUTUBE_ENABLED:true}
      api-key: ${YOUTUBE_API_KEY:}
      region-code: ${YOUTUBE_REGION_CODE:BG}
    # Free, keyless; asks for a descriptive User-Agent with a contact and ~1 request/second.
    musicbrainz:
      enabled: ${MUSICBRAINZ_ENABLED:true}
      user-agent: ${MUSICBRAINZ_USER_AGENT:Aura-Music-Platform/0.1 (dev; antoan.0418@gmail.com)}
    # Second in the video-hint chain (by artist + title, no ISRC needed); 60 req/min with a personal token.
    discogs:
      enabled: ${DISCOGS_ENABLED:true}
      token: ${DISCOGS_TOKEN:}
      user-agent: ${DISCOGS_USER_AGENT:Aura-Music-Platform/0.1 (dev; antoan.0418@gmail.com)}

aura:
  # Talks to catalog-svc directly (service-to-service), not through the gateway.
  catalog-client:
    base-url: ${CATALOG_SVC_URL:http://localhost:8081}

# playback.matching.* overrides MatchingProperties' scoring weights/thresholds (Project-Info.md §18).
playback:
  matching:
    # Label channels trusted as official uploaders (+labelChannelBonus). Channels whose name contains
    # "Records" get the same credit without being listed.
    trusted-label-channels:
      - Virginia Records
      - FacingTheSunOfficial
      - Monte Music
      - Facing The Sun
  resolver:
    # A track that resolved to nothing confident is looked up again after this long — YouTube
    # uploads change, and the matcher may have improved.
    retry-unverified-after: 7d
  # Background walk over the whole catalog, most popular first: MusicBrainz (by ISRC) may already know
  # the YouTube video, which then costs 1 quota unit to validate instead of 100 for a search. Every
  # track is asked about exactly once, whatever the outcome; tracks sharing an ISRC with one already
  # checked reuse its answer without any call.
  video-hints:
    enabled: ${VIDEO_HINTS_ENABLED:true}
    page-size: 25
    delay-between-pages: 1s
    delay-between-quiet-pages: 100ms
    idle-after-full-pass: 10m
    backoff-on-outage: 5m

resilience4j:
  circuitbreaker:
    instances:
      youtube:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      musicbrainz:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      discogs:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      catalog:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  # Resilience4j's own default TimeLimiter timeout is 1s — too tight even for a single real call
  # once you count connection setup, so every instance gets the same explicit headroom catalog-svc
  # needed for TIDAL.
  timelimiter:
    instances:
      youtube:
        timeout-duration: 8s
      catalog:
        timeout-duration: 8s
      # MusicBrainz calls wait their turn (1/s) and retry on "busy" inside the breaker — far longer than one HTTP call.
      musicbrainz:
        timeout-duration: 60s
      # Up to three paced Discogs calls per track (master search, release search, page).
      discogs:
        timeout-duration: 60s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Plain, readable console logging for local dev (IntelliJ, ./gradlew bootRun). Structured JSON logs
# live in application-prod.yml — activate with SPRING_PROFILES_ACTIVE=prod (Render deployment).
